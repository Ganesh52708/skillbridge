<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — SkillBridge AI</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: linear-gradient(135deg, #0f1117 0%, #1a1a2e 60%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .admin-auth-box { background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 25px 60px rgba(0,0,0,.4); }
  .admin-auth-box .brand { text-align: center; font-size: 1.6rem; font-weight: 900; margin-bottom: 4px; }
  .admin-auth-box .tagline { text-align: center; color: #64748b; font-size: .85rem; margin-bottom: 28px; }
  .admin-demo-hint { margin-top: 16px; padding: 12px; background: #f8fafc; border: 1px dashed #e2e8f0; border-radius: 10px; font-size: .8rem; color: #64748b; text-align: center; }
</style>
</head>
<body>
<div class="admin-auth-box">
  <div class="brand">🛡️ SkillBridge AI</div>
  <div class="tagline">Admin Control Panel</div>
  <div class="form-group">
    <label class="form-label">Admin Email</label>
    <input type="email" class="form-control" id="admin-email" placeholder="admin@skillbridge.com">
  </div>
  <div class="form-group">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" id="admin-password" placeholder="Enter password">
  </div>
  <button class="btn btn-primary btn-block btn-lg" onclick="doAdminLogin()" style="margin-top:8px;background:#0f1117">Login to Admin Panel →</button>
  <div class="admin-demo-hint">Demo credentials: <strong>admin@skillbridge.com</strong> / <strong>admin123</strong></div>
  <div style="text-align:center;margin-top:16px"><a href="auth.html" style="color:#94a3b8;font-size:.8rem;text-decoration:none">← Back to student/company login</a></div>
</div>

<script src="data.js"></script>
<script>
document.getElementById('admin-password').addEventListener('keydown', e => { if (e.key === 'Enter') doAdminLogin(); });

function doAdminLogin() {
  const email = document.getElementById('admin-email').value.trim();
  const pass = document.getElementById('admin-password').value;
  if (!email || !pass) { showToast('Please fill all fields', 'error'); return; }
  const a = Auth.loginAdmin(email, pass);
  if (a) {
    showToast('Welcome, ' + a.name + '!');
    setTimeout(() => window.location.href = 'admin-dashboard.html', 600);
  } else {
    showToast('Invalid admin credentials', 'error');
  }
}
</script>
</body>
</html>
