<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Job/Internship — SkillBridge AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="data.js"></script>
<script src="layout.js"></script>
<script>
const company = buildCompanyLayout('Post Job / Internship', 'post', '<div id="post-content"></div>');
let postType = 'internship';

function renderPost() {
  document.getElementById('post-content').innerHTML = `
    <div style="max-width:800px;margin:0 auto">
      <div class="card" style="margin-bottom:20px">
        <div class="card-title" style="margin-bottom:16px">Choose Opportunity Type</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="role-btn ${postType==='internship'?'active':''}" onclick="postType='internship';renderPost()" style="padding:20px;border:2px solid ${postType==='internship'?'#6366f1':'#e2e8f0'};border-radius:12px;cursor:pointer;text-align:center;background:${postType==='internship'?'#ede9fe':'#fff'}">
            <div style="font-size:2rem;margin-bottom:8px">🎓</div>
            <div style="font-weight:700">Internship</div>
            <div class="text-muted text-sm">Short-term, stipend-based</div>
          </div>
          <div class="role-btn ${postType==='job'?'active':''}" onclick="postType='job';renderPost()" style="padding:20px;border:2px solid ${postType==='job'?'#6366f1':'#e2e8f0'};border-radius:12px;cursor:pointer;text-align:center;background:${postType==='job'?'#ede9fe':'#fff'}">
            <div style="font-size:2rem;margin-bottom:8px">💼</div>
            <div style="font-weight:700">Full-Time Job</div>
            <div class="text-muted text-sm">Permanent position</div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:20px">📝 ${postType==='internship'?'Internship':'Job'} Details</div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Title *</label><input class="form-control" id="p-title" placeholder="e.g. Frontend Developer ${postType==='internship'?'Intern':''}"></div>
          <div class="form-group"><label class="form-label">Location *</label><input class="form-control" id="p-location" placeholder="e.g. Remote, Pune, Bangalore"></div>
        </div>
        <div class="form-group"><label class="form-label">Description *</label><textarea class="form-control" id="p-desc" rows="3" placeholder="Describe the role and what the candidate will work on..."></textarea></div>
        <div class="form-group"><label class="form-label">Responsibilities (one per line)</label><textarea class="form-control" id="p-resp" rows="3" placeholder="Build UI components&#10;Integrate REST APIs&#10;Write unit tests"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Required Skills (comma separated) *</label><input class="form-control" id="p-skills" placeholder="React, JavaScript, HTML, CSS"></div>
          <div class="form-group"><label class="form-label">Education Required</label><input class="form-control" id="p-edu" placeholder="B.Tech/BCA"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">${postType==='internship'?'Stipend':'Salary'} *</label><input class="form-control" id="p-pay" placeholder="${postType==='internship'?'₹10,000/month':'₹6-8 LPA'}"></div>
          <div class="form-group"><label class="form-label">${postType==='internship'?'Duration':'Employment Type'}</label><input class="form-control" id="p-duration" placeholder="${postType==='internship'?'3 Months':'Full Time'}"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Number of Openings</label><input class="form-control" type="number" id="p-openings" placeholder="5" min="1"></div>
          <div class="form-group"><label class="form-label">Application Deadline</label><input class="form-control" type="date" id="p-deadline"></div>
        </div>
        <div class="form-group"><label class="form-label">Experience Required</label>
          <select class="form-control form-select" id="p-exp">
            <option>Fresher</option><option>0-1 year</option><option>0-2 years</option><option>1-3 years</option>
          </select>
        </div>
        <div style="display:flex;gap:12px;margin-top:8px">
          <button class="btn btn-ghost" onclick="window.location.href='company-dashboard.html'">Cancel</button>
          <button class="btn btn-primary btn-lg" onclick="publishOpportunity()">🚀 Publish Opportunity</button>
        </div>
      </div>
    </div>`;
}

function publishOpportunity() {
  const title = document.getElementById('p-title').value.trim();
  const location = document.getElementById('p-location').value.trim();
  const desc = document.getElementById('p-desc').value.trim();
  const skills = document.getElementById('p-skills').value.split(',').map(s=>s.trim()).filter(Boolean);
  const pay = document.getElementById('p-pay').value.trim();
  if (!title || !location || !desc || !skills.length || !pay) { showToast('Please fill all required fields', 'error'); return; }

  const opps = Storage.getOpportunities();
  const newOpp = {
    id: 'o' + Date.now(), companyId: company.id, companyName: company.name, type: postType,
    title, location, description: desc, skills,
    responsibilities: document.getElementById('p-resp').value.split('\n').filter(Boolean),
    education: document.getElementById('p-edu').value || 'Any',
    experience: document.getElementById('p-exp').value,
    openings: parseInt(document.getElementById('p-openings').value) || 1,
    deadline: document.getElementById('p-deadline').value || '2025-03-31',
    posted: new Date().toISOString().split('T')[0],
    logo: company.logo || '🏢',
    ...(postType === 'internship' ? { stipend: pay, duration: document.getElementById('p-duration').value || '3 Months' } : { salary: pay, duration: 'Full Time' })
  };
  opps.push(newOpp);
  Storage.set('sb_opportunities', opps);
  Storage.logActivity('job_post', '💼', `${company.name} posted ${title} (${postType})`);
  showToast(`${postType==='internship'?'Internship':'Job'} "${title}" published successfully! 🎉`);
  setTimeout(() => window.location.href = 'company-dashboard.html', 1000);
}

renderPost();
</script>
</body>
</html>
