<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Tests — SkillBridge AI</title>
<link rel="stylesheet" href="styles.css">
<style>
  .test-container { max-width: 800px; margin: 0 auto; }
  .question-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .q-btn { width: 36px; height: 36px; border-radius: 8px; border: 2px solid #e2e8f0; background: #fff; font-size: .8rem; font-weight: 700; cursor: pointer; transition: all .2s; }
  .q-btn.answered { background: #6366f1; color: #fff; border-color: #6366f1; }
  .q-btn.marked { background: #f97316; color: #fff; border-color: #f97316; }
  .q-btn.current { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
  .option-btn { width: 100%; text-align: left; padding: 14px 18px; border: 2px solid #e2e8f0; border-radius: 10px; background: #fff; cursor: pointer; font-size: .9rem; transition: all .2s; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .option-btn:hover { border-color: #6366f1; background: #ede9fe; }
  .option-btn.selected { border-color: #6366f1; background: #ede9fe; }
  .option-btn.correct { border-color: #10b981; background: #d1fae5; }
  .option-btn.wrong { border-color: #ef4444; background: #fee2e2; }
  .timer { font-size: 1.4rem; font-weight: 800; color: #6366f1; }
  .timer.warning { color: #ef4444; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.5} }
  .result-card { text-align: center; padding: 32px; }
  .result-score { font-size: 4rem; font-weight: 900; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
<script src="data.js"></script>
<script src="layout.js"></script>
<script>
const student = buildStudentLayout('Mock Tests', 'mocktest', '<div id="test-content"></div>');

const QUESTIONS = [
  { id:1, subject:'Aptitude', q:'A train travels 360 km in 4 hours. What is its speed in m/s?', opts:['25 m/s','30 m/s','22.5 m/s','20 m/s'], ans:0 },
  { id:2, subject:'Aptitude', q:'If 15 workers can complete a job in 8 days, how many days will 12 workers take?', opts:['10 days','12 days','9 days','11 days'], ans:0 },
  { id:3, subject:'Reasoning', q:'Find the odd one out: 2, 3, 5, 7, 9, 11', opts:['9','7','5','11'], ans:0 },
  { id:4, subject:'Reasoning', q:'If MANGO is coded as OCPIQ, how is APPLE coded?', opts:['CRRNG','CRRNF','BQQMF','DSSOH'], ans:0 },
  { id:5, subject:'Programming', q:'What is the time complexity of binary search?', opts:['O(n)','O(log n)','O(n²)','O(1)'], ans:1 },
  { id:6, subject:'Programming', q:'Which data structure uses LIFO principle?', opts:['Queue','Stack','Array','Linked List'], ans:1 },
  { id:7, subject:'Programming', q:'What does HTML stand for?', opts:['Hyper Text Markup Language','High Text Machine Language','Hyper Transfer Markup Language','None'], ans:0 },
  { id:8, subject:'English', q:'Choose the correct sentence:', opts:['She don\'t know the answer','She doesn\'t know the answer','She not know the answer','She didn\'t knew the answer'], ans:1 },
  { id:9, subject:'English', q:'Synonym of "Eloquent":', opts:['Silent','Articulate','Confused','Dull'], ans:1 },
  { id:10, subject:'Technical', q:'Which of the following is NOT a JavaScript data type?', opts:['String','Boolean','Float','Undefined'], ans:2 },
  { id:11, subject:'Aptitude', q:'What is 15% of 240?', opts:['36','34','38','32'], ans:0 },
  { id:12, subject:'Reasoning', q:'Complete the series: 1, 4, 9, 16, 25, ?', opts:['30','36','35','49'], ans:1 },
  { id:13, subject:'Programming', q:'What is a constructor in OOP?', opts:['A method to destroy objects','A special method to initialize objects','A method to copy objects','None'], ans:1 },
  { id:14, subject:'Technical', q:'Which SQL command is used to retrieve data?', opts:['INSERT','UPDATE','SELECT','DELETE'], ans:2 },
  { id:15, subject:'English', q:'Antonym of "Benevolent":', opts:['Kind','Malevolent','Generous','Helpful'], ans:1 },
];

let state = { phase: 'start', current: 0, answers: {}, marked: new Set(), timeLeft: 30*60, timer: null, startTime: null };

function renderStart() {
  document.getElementById('test-content').innerHTML = `
    <div class="test-container">
      <div class="card" style="text-align:center;padding:48px">
        <div style="font-size:4rem;margin-bottom:16px">📝</div>
        <h2 style="font-size:1.8rem;font-weight:800;margin-bottom:8px">Daily Mock Test</h2>
        <p class="text-muted" style="margin-bottom:24px">Test your knowledge across multiple subjects</p>
        <div class="grid-4" style="margin-bottom:32px">
          ${[['📋','15','Questions'],['⏱️','30','Minutes'],['📚','5','Subjects'],['🏆','100','Points']].map(([i,v,l])=>`<div class="card" style="text-align:center;padding:16px"><div style="font-size:1.5rem">${i}</div><div style="font-size:1.4rem;font-weight:800;color:#6366f1">${v}</div><div class="text-muted text-sm">${l}</div></div>`).join('')}
        </div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px">
          ${['Aptitude','Reasoning','Programming','English','Technical'].map(s=>`<span class="skill-tag">${s}</span>`).join('')}
        </div>
        <button class="btn btn-primary btn-lg" onclick="startTest()">🚀 Start Test</button>
      </div>
      ${student.testHistory?.length ? `<div class="card" style="margin-top:20px">
        <div class="card-header"><span class="card-title">📊 Previous Tests</span></div>
        <div class="table-wrap"><table><thead><tr><th>Date</th><th>Test</th><th>Score</th><th>Aptitude</th><th>Programming</th></tr></thead><tbody>
        ${student.testHistory.map(t=>`<tr><td>${t.date}</td><td>${t.test}</td><td><span class="badge ${scoreBadge(t.score)}">${t.score}%</span></td><td>${t.aptitude}%</td><td>${t.programming}%</td></tr>`).join('')}
        </tbody></table></div>
      </div>` : ''}
    </div>`;
}

function startTest() {
  state = { phase: 'test', current: 0, answers: {}, marked: new Set(), timeLeft: 30*60, timer: null, startTime: Date.now() };
  state.timer = setInterval(tickTimer, 1000);
  renderQuestion();
}

function tickTimer() {
  state.timeLeft--;
  const el = document.getElementById('timer-display');
  if (el) {
    const m = Math.floor(state.timeLeft/60), s = state.timeLeft%60;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (state.timeLeft < 300) el.classList.add('warning');
  }
  if (state.timeLeft <= 0) submitTest();
}

function renderQuestion() {
  const q = QUESTIONS[state.current];
  const m = Math.floor(state.timeLeft/60), s = state.timeLeft%60;
  const navBtns = QUESTIONS.map((_, i) => {
    let cls = 'q-btn';
    if (i === state.current) cls += ' current';
    else if (state.marked.has(i)) cls += ' marked';
    else if (state.answers[i] !== undefined) cls += ' answered';
    return `<button class="${cls}" onclick="goTo(${i})">${i+1}</button>`;
  }).join('');

  document.getElementById('test-content').innerHTML = `
    <div class="test-container">
      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
          <div>
            <span class="badge badge-purple">${q.subject}</span>
            <span style="margin-left:10px;font-size:.875rem;color:#64748b">Question ${state.current+1} of ${QUESTIONS.length}</span>
          </div>
          <div class="timer" id="timer-display">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>
        </div>
        <div style="margin-top:12px">
          <div style="background:#e2e8f0;border-radius:20px;height:6px"><div style="background:#6366f1;height:6px;border-radius:20px;width:${((state.current+1)/QUESTIONS.length)*100}%;transition:width .3s"></div></div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div style="font-size:1.05rem;font-weight:600;margin-bottom:20px;line-height:1.6">${state.current+1}. ${q.q}</div>
        ${q.opts.map((o,i)=>`<button class="option-btn ${state.answers[state.current]===i?'selected':''}" onclick="selectAnswer(${i})"><span style="width:24px;height:24px;border-radius:50%;background:${state.answers[state.current]===i?'#6366f1':'#e2e8f0'};color:${state.answers[state.current]===i?'#fff':'#64748b'};display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}
      </div>
      <div class="card" style="margin-bottom:16px">
        <div style="font-size:.8rem;font-weight:700;color:#64748b;margin-bottom:8px">QUESTION NAVIGATOR</div>
        <div class="question-nav">${navBtns}</div>
        <div style="display:flex;gap:12px;font-size:.75rem;color:#64748b;flex-wrap:wrap">
          <span><span style="display:inline-block;width:12px;height:12px;background:#6366f1;border-radius:3px;margin-right:4px"></span>Answered</span>
          <span><span style="display:inline-block;width:12px;height:12px;background:#f97316;border-radius:3px;margin-right:4px"></span>Marked</span>
          <span><span style="display:inline-block;width:12px;height:12px;background:#e2e8f0;border-radius:3px;margin-right:4px"></span>Not Answered</span>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="prevQ()" ${state.current===0?'disabled':''}>← Previous</button>
        <button class="btn btn-outline btn-sm" onclick="markReview()">🚩 Mark for Review</button>
        <button class="btn btn-primary" onclick="nextQ()" style="margin-left:auto">${state.current===QUESTIONS.length-1?'Submit Test ✓':'Next →'}</button>
      </div>
    </div>`;
}

function selectAnswer(i) { state.answers[state.current] = i; renderQuestion(); }
function prevQ() { if (state.current > 0) { state.current--; renderQuestion(); } }
function nextQ() { if (state.current < QUESTIONS.length-1) { state.current++; renderQuestion(); } else submitTest(); }
function goTo(i) { state.current = i; renderQuestion(); }
function markReview() { if (state.marked.has(state.current)) state.marked.delete(state.current); else state.marked.add(state.current); renderQuestion(); }

function submitTest() {
  clearInterval(state.timer);
  let correct = 0;
  QUESTIONS.forEach((q,i) => { if (state.answers[i] === q.ans) correct++; });
  const score = Math.round((correct/QUESTIONS.length)*100);
  const timeTaken = Math.round((Date.now() - state.startTime)/60000);
  const subjects = {};
  QUESTIONS.forEach((q,i) => {
    if (!subjects[q.subject]) subjects[q.subject] = { total:0, correct:0 };
    subjects[q.subject].total++;
    if (state.answers[i] === q.ans) subjects[q.subject].correct++;
  });
  const subjectScores = Object.entries(subjects).map(([s,d]) => ({ subject:s, score: Math.round((d.correct/d.total)*100) }));

  // Update student data
  const students = Storage.getStudents();
  const idx = students.findIndex(s => s.id === student.id);
  if (idx >= 0) {
    const newTest = { date: new Date().toISOString().split('T')[0], test: 'Full Mock Test', score, aptitude: subjectScores.find(s=>s.subject==='Aptitude')?.score||0, reasoning: subjectScores.find(s=>s.subject==='Reasoning')?.score||0, programming: subjectScores.find(s=>s.subject==='Programming')?.score||0, english: subjectScores.find(s=>s.subject==='English')?.score||0 };
    students[idx].testHistory = [newTest, ...(students[idx].testHistory||[])].slice(0,10);
    const newCareer = Math.min(100, Math.max(0, Math.round(students[idx].careerScore * 0.8 + score * 0.2)));
    students[idx].careerScore = newCareer;
    students[idx].aptitudeScore = subjectScores.find(s=>s.subject==='Aptitude')?.score || students[idx].aptitudeScore;
    Storage.set('sb_students', students);
    Storage.logActivity('test', '📝', `${student.name} completed a Full Mock Test scoring ${score}%`);
  }

  const weakSubjects = subjectScores.filter(s => s.score < 70);
  document.getElementById('test-content').innerHTML = `
    <div class="test-container">
      <div class="card result-card">
        <div style="font-size:3rem;margin-bottom:8px">🎉</div>
        <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:4px">Test Completed!</h2>
        <div class="result-score">${score}%</div>
        <div style="display:flex;gap:24px;justify-content:center;margin:20px 0;flex-wrap:wrap">
          <div><div style="font-size:1.4rem;font-weight:800;color:#10b981">${correct}</div><div class="text-muted text-sm">Correct</div></div>
          <div><div style="font-size:1.4rem;font-weight:800;color:#ef4444">${QUESTIONS.length-correct}</div><div class="text-muted text-sm">Wrong</div></div>
          <div><div style="font-size:1.4rem;font-weight:800;color:#6366f1">${timeTaken} min</div><div class="text-muted text-sm">Time Taken</div></div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px">
          ${subjectScores.map(s=>`<div class="card" style="text-align:center;padding:12px">
            <div style="font-size:.8rem;color:#64748b;margin-bottom:4px">${s.subject}</div>
            <div style="font-size:1.2rem;font-weight:800;color:${scoreColor(s.score)}">${s.score}%</div>
            <div class="progress-bar" style="margin-top:6px"><div class="progress-fill" style="width:${s.score}%;background:${scoreColor(s.score)}"></div></div>
          </div>`).join('')}
        </div>
        ${weakSubjects.length ? `<div class="ai-box" style="text-align:left;margin-bottom:20px">
          <div class="ai-box-title">🧠 AI Skill Analysis</div>
          <p style="font-size:.875rem;margin-bottom:8px">You need improvement in:</p>
          ${weakSubjects.map(s=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="color:#f97316">⚠️</span><span style="font-size:.875rem;font-weight:600">${s.subject} (${s.score}%)</span></div>`).join('')}
          <p style="font-size:.875rem;margin-top:8px;color:#374151">Recommended: Practice more ${weakSubjects.map(s=>s.subject).join(', ')} questions</p>
        </div>` : `<div class="ai-box" style="text-align:left;margin-bottom:20px"><div class="ai-box-title">🧠 AI Analysis</div><p style="font-size:.875rem">Excellent performance! Keep up the great work.</p></div>`}
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="renderStart()">Take Another Test</button>
          <a href="student-learning.html" class="btn btn-outline">View Learning Plan</a>
          <a href="student-dashboard.html" class="btn btn-ghost">Back to Dashboard</a>
        </div>
      </div>
    </div>`;
  showToast(`Test completed! Score: ${score}%`);
}

renderStart();
</script>
</body>
</html>
