<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Voice Interview — SkillBridge AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="data.js"></script>
<script src="layout.js"></script>
<script>
const student = buildStudentLayout('AI Voice Interview', 'interview', '<div id="interview-content"></div>');

const INTERVIEW_TYPES = [
  { id:'hr', label:'HR Interview', icon:'👔', desc:'Behavioral & personality questions', color:'#6366f1' },
  { id:'technical', label:'Technical Interview', icon:'💻', desc:'Technical & coding questions', color:'#8b5cf6' },
  { id:'behavioral', label:'Behavioral Interview', icon:'🧠', desc:'Situation-based questions', color:'#f97316' },
  { id:'internship', label:'Internship Interview', icon:'🎓', desc:'Entry-level focused questions', color:'#10b981' },
];

const QUESTIONS_MAP = {
  hr: ['Tell me about yourself.','What are your greatest strengths?','Where do you see yourself in 5 years?','Why should we hire you?','What is your biggest weakness?','Describe a challenge you faced and how you overcame it.'],
  technical: ['Explain the difference between stack and queue.','What is object-oriented programming?','Explain the concept of recursion with an example.','What is the difference between SQL and NoSQL?','Explain REST API.'],
  behavioral: ['Tell me about a time you worked in a team.','Describe a situation where you had to meet a tight deadline.','Give an example of when you showed leadership.','Tell me about a time you failed and what you learned.'],
  internship: ['Why are you interested in this internship?','What skills do you bring to this role?','Tell me about a project you have worked on.','How do you handle feedback and criticism?','What do you hope to learn from this internship?'],
};

let iState = { phase: 'select', type: null, questions: [], current: 0, answers: [], recognition: null, synthesis: window.speechSynthesis, speaking: false, listening: false, transcript: '' };

function renderSelect() {
  document.getElementById('interview-content').innerHTML = `
    <div style="max-width:700px;margin:0 auto">
      <div class="card" style="text-align:center;padding:32px;margin-bottom:20px">
        <div style="font-size:3rem;margin-bottom:12px">🎙️</div>
        <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:8px">AI Voice Interview</h2>
        <p class="text-muted">Practice real interviews with AI voice technology. Get scored on communication, confidence, and technical knowledge.</p>
        <div class="streak-badge" style="margin-top:12px;display:inline-flex">🔥 ${student.streak} Day Streak</div>
      </div>
      <div class="section-title">Choose Interview Type</div>
      <div class="grid-2" style="margin-bottom:20px">
        ${INTERVIEW_TYPES.map(t=>`<div class="card" style="cursor:pointer;border:2px solid transparent;transition:all .2s" onclick="selectType('${t.id}')" onmouseover="this.style.borderColor='${t.color}'" onmouseout="this.style.borderColor='transparent'">
          <div style="font-size:2rem;margin-bottom:8px">${t.icon}</div>
          <div style="font-weight:700;margin-bottom:4px">${t.label}</div>
          <div class="text-muted text-sm">${t.desc}</div>
        </div>`).join('')}
      </div>
      ${student.interviewHistory?.length ? `<div class="card">
        <div class="card-header"><span class="card-title">📊 Interview History</span></div>
        <div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Score</th><th>Communication</th><th>Technical</th></tr></thead><tbody>
        ${student.interviewHistory.map(i=>`<tr><td>${i.date}</td><td>${i.type}</td><td><span class="badge ${scoreBadge(i.score)}">${i.score}%</span></td><td>${i.communication}%</td><td>${i.technical}%</td></tr>`).join('')}
        </tbody></table></div>
      </div>` : ''}
    </div>`;
}

function selectType(type) {
  iState.type = type;
  iState.questions = [...QUESTIONS_MAP[type]];
  iState.current = 0;
  iState.answers = [];
  renderInterview();
}

function renderInterview() {
  const q = iState.questions[iState.current];
  const typeInfo = INTERVIEW_TYPES.find(t => t.id === iState.type);
  const hasSpeech = 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;

  document.getElementById('interview-content').innerHTML = `
    <div style="max-width:700px;margin:0 auto">
      <div class="interview-panel" style="margin-bottom:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
          <span class="badge" style="background:rgba(255,255,255,.2);color:#fff">${typeInfo.label}</span>
          <span style="font-size:.875rem;opacity:.7">Question ${iState.current+1} of ${iState.questions.length}</span>
        </div>
        <div class="interview-avatar">🤖</div>
        <div style="font-size:.85rem;opacity:.6;margin-bottom:8px">AI Interviewer</div>
        <div class="interview-question" id="ai-question">"${q}"</div>
        <div id="ai-status" style="font-size:.85rem;opacity:.7;margin-bottom:16px">Click the microphone to answer</div>
        <button class="mic-btn" id="mic-btn" onclick="toggleListening()" title="Click to speak">🎙️</button>
        <div id="transcript-box" style="background:rgba(255,255,255,.1);border-radius:10px;padding:12px;margin-top:12px;min-height:60px;font-size:.875rem;text-align:left;display:none">
          <div style="font-size:.75rem;opacity:.6;margin-bottom:4px">Your Answer:</div>
          <div id="transcript-text" style="line-height:1.6"></div>
        </div>
        ${!hasSpeech ? `<div style="background:rgba(255,165,0,.2);border:1px solid rgba(255,165,0,.4);border-radius:8px;padding:12px;margin-top:12px;font-size:.8rem">⚠️ Voice recognition unavailable. Use text input below.</div>` : ''}
      </div>
      ${!hasSpeech ? `<div class="card" style="margin-bottom:16px">
        <label class="form-label">Type your answer:</label>
        <textarea class="form-control" id="text-answer" rows="4" placeholder="Type your answer here..."></textarea>
      </div>` : ''}
      <div class="card">
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-ghost" onclick="renderSelect()">← Exit</button>
          <button class="btn btn-outline" onclick="speakQuestion()">🔊 Repeat Question</button>
          <button class="btn btn-primary" onclick="nextQuestion()" style="margin-left:auto">
            ${iState.current < iState.questions.length-1 ? 'Next Question →' : 'Finish Interview ✓'}
          </button>
        </div>
      </div>
    </div>`;

  // Auto-speak question
  setTimeout(() => speakQuestion(), 500);
}

function speakQuestion() {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const q = iState.questions[iState.current];
  const utt = new SpeechSynthesisUtterance(q);
  utt.rate = 0.9; utt.pitch = 1;
  const status = document.getElementById('ai-status');
  if (status) status.textContent = '🔊 AI is speaking...';
  utt.onend = () => { if (status) status.textContent = 'Click the microphone to answer'; };
  window.speechSynthesis.speak(utt);
}

function toggleListening() {
  if (iState.listening) { stopListening(); return; }
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) { showToast('Voice recognition not supported. Use text input.', 'info'); return; }
  iState.recognition = new SpeechRec();
  iState.recognition.continuous = true;
  iState.recognition.interimResults = true;
  iState.recognition.lang = 'en-US';
  iState.recognition.onresult = (e) => {
    let transcript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) transcript += e.results[i][0].transcript;
    iState.transcript = transcript;
    const box = document.getElementById('transcript-box');
    const txt = document.getElementById('transcript-text');
    if (box) box.style.display = 'block';
    if (txt) txt.textContent = transcript;
  };
  iState.recognition.onerror = () => { stopListening(); showToast('Microphone error. Try text input.', 'error'); };
  iState.recognition.start();
  iState.listening = true;
  const btn = document.getElementById('mic-btn');
  const status = document.getElementById('ai-status');
  if (btn) { btn.classList.add('listening'); btn.textContent = '⏹️'; }
  if (status) status.textContent = '🔴 Listening... Click to stop';
}

function stopListening() {
  if (iState.recognition) { iState.recognition.stop(); iState.recognition = null; }
  iState.listening = false;
  const btn = document.getElementById('mic-btn');
  const status = document.getElementById('ai-status');
  if (btn) { btn.classList.remove('listening'); btn.textContent = '🎙️'; }
  if (status) status.textContent = '✅ Answer recorded. Click Next to continue.';
}

function nextQuestion() {
  stopListening();
  window.speechSynthesis?.cancel();
  const textAnswer = document.getElementById('text-answer');
  const answer = iState.transcript || (textAnswer ? textAnswer.value : '') || '[No answer provided]';
  iState.answers.push({ question: iState.questions[iState.current], answer });
  iState.transcript = '';
  if (iState.current < iState.questions.length - 1) {
    iState.current++;
    renderInterview();
  } else {
    renderResults();
  }
}

function renderResults() {
  // Mock AI scoring
  const scores = { communication: 65+Math.floor(Math.random()*20), confidence: 60+Math.floor(Math.random()*20), technical: 70+Math.floor(Math.random()*20), clarity: 65+Math.floor(Math.random()*20), problemSolving: 68+Math.floor(Math.random()*20) };
  const overall = Math.round(Object.values(scores).reduce((a,b)=>a+b,0)/Object.keys(scores).length);

  // Save result
  const students = Storage.getStudents();
  const idx = students.findIndex(s => s.id === student.id);
  if (idx >= 0) {
    const newInterview = { date: new Date().toISOString().split('T')[0], type: INTERVIEW_TYPES.find(t=>t.id===iState.type).label, score: overall, ...scores };
    students[idx].interviewHistory = [newInterview, ...(students[idx].interviewHistory||[])].slice(0,10);
    students[idx].interviewScore = Math.round((students[idx].interviewScore * 0.7 + overall * 0.3));
    students[idx].communicationScore = Math.round((students[idx].communicationScore * 0.7 + scores.communication * 0.3));
    students[idx].streak = (students[idx].streak || 0) + 1;
    const newCareer = Math.min(100, Math.round(students[idx].careerScore * 0.85 + overall * 0.15));
    students[idx].careerScore = newCareer;
    Storage.set('sb_students', students);
    Storage.logActivity('interview', '🎤', `${student.name} completed a ${newInterview.type} scoring ${overall}%`);
  }

  document.getElementById('interview-content').innerHTML = `
    <div style="max-width:700px;margin:0 auto">
      <div class="card" style="text-align:center;padding:32px;margin-bottom:20px">
        <div style="font-size:3rem;margin-bottom:8px">🎉</div>
        <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:4px">Interview Complete!</h2>
        <div style="font-size:3.5rem;font-weight:900;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${overall}%</div>
        <div class="text-muted">Overall Interview Score</div>
        <div class="streak-badge" style="margin-top:12px;display:inline-flex">🔥 Streak Updated!</div>
      </div>
      <div class="card" style="margin-bottom:20px">
        <div class="card-title" style="margin-bottom:16px">📊 Detailed Scores</div>
        ${Object.entries(scores).map(([k,v])=>`<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:.875rem;font-weight:600;text-transform:capitalize">${k.replace(/([A-Z])/g,' $1')}</span><span style="font-weight:700;color:${scoreColor(v)}">${v}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${v}%;background:${scoreColor(v)}"></div></div>
        </div>`).join('')}
      </div>
      <div class="card" style="margin-bottom:20px">
        <div class="card-title" style="margin-bottom:12px">🤖 AI Feedback</div>
        <div class="ai-box">
          <div class="ai-box-title">What you did well:</div>
          <div style="font-size:.875rem;margin-bottom:10px">✓ Good technical knowledge demonstrated<br>✓ Clear project explanation<br>✓ Relevant examples provided</div>
          <div class="ai-box-title">Areas to improve:</div>
          <div style="font-size:.875rem">⚠️ Speak more confidently<br>⚠️ Avoid long pauses<br>⚠️ Give more concise answers</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="renderSelect()">Practice Again</button>
        <a href="student-internships.html" class="btn btn-outline">Explore Internships</a>
        <a href="student-dashboard.html" class="btn btn-ghost">Dashboard</a>
      </div>
    </div>`;
  showToast(`Interview complete! Score: ${overall}%`);
}

renderSelect();
</script>
</body>
</html>
