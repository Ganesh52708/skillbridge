<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance — SkillBridge AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="data.js"></script>
<script src="layout.js"></script>
<script>
const student = buildStudentLayout('Performance', 'performance', '<div id="perf-content"></div>');

function renderPerformance() {
  const scores = student.scoreHistory || [72,74,73,76,75,78,78];
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const maxScore = Math.max(...scores);

  const barsHTML = scores.map((s,i) => {
    const h = Math.round((s/100)*140);
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
      <div style="font-size:.7rem;color:#64748b;font-weight:600">${s}%</div>
      <div style="height:${h}px;background:${s===maxScore?'linear-gradient(180deg,#6366f1,#8b5cf6)':'#c7d2fe'};width:100%;border-radius:4px 4px 0 0;transition:height 1s ease"></div>
      <div style="font-size:.7rem;color:#94a3b8">${days[i]}</div>
    </div>`;
  }).join('');

  document.getElementById('perf-content').innerHTML = `
    <div class="stats-grid" style="margin-bottom:24px">
      ${[['📊',student.careerScore+'%','Career Readiness','#ede9fe'],['📝',student.testHistory?.[0]?.score+'%'||'N/A','Last Test Score','#dbeafe'],['🎙️',student.interviewScore+'%','Interview Score','#d1fae5'],['🔥',student.streak+' days','Practice Streak','#fef3c7']].map(([i,v,l,bg])=>`
        <div class="stat-card"><div class="stat-icon" style="background:${bg};font-size:1.4rem">${i}</div><div class="stat-info"><div class="value">${v}</div><div class="label">${l}</div></div></div>`).join('')}
    </div>

    <div class="grid-2" style="margin-bottom:20px">
      <div class="card">
        <div class="card-header"><span class="card-title">📈 Career Readiness Trend</span><span class="badge badge-success">This Week</span></div>
        <div class="chart-area" style="height:160px">${barsHTML}</div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">🎯 Skill Breakdown</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:8px 0">
          <div class="score-ring">${progressRing(student.technicalScore,70,7)}<span class="label">Technical</span></div>
          <div class="score-ring">${progressRing(student.aptitudeScore,70,7)}<span class="label">Aptitude</span></div>
          <div class="score-ring">${progressRing(student.communicationScore,70,7)}<span class="label">Communication</span></div>
          <div class="score-ring">${progressRing(student.problemSolvingScore,70,7)}<span class="label">Problem Solving</span></div>
          <div class="score-ring">${progressRing(student.interviewScore,70,7)}<span class="label">Interview</span></div>
        </div>
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:20px">
      <div class="card">
        <div class="card-header"><span class="card-title">📝 Test History</span><a href="student-mocktest.html" class="btn btn-primary btn-sm">Take Test</a></div>
        ${(student.testHistory||[]).length ? `<div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Test</th><th>Score</th><th>Aptitude</th><th>Programming</th></tr></thead>
          <tbody>${(student.testHistory||[]).map(t=>`<tr>
            <td class="text-sm text-muted">${t.date}</td>
            <td style="font-weight:600">${t.test}</td>
            <td><span class="badge ${scoreBadge(t.score)}">${t.score}%</span></td>
            <td>${t.aptitude}%</td>
            <td>${t.programming}%</td>
          </tr>`).join('')}</tbody>
        </table></div>` : `<div class="empty-state"><p>No tests taken yet</p><a href="student-mocktest.html" class="btn btn-primary btn-sm" style="margin-top:8px">Take First Test</a></div>`}
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">🎙️ Interview History</span><a href="student-interview.html" class="btn btn-primary btn-sm">Practice</a></div>
        ${(student.interviewHistory||[]).length ? `<div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Type</th><th>Score</th><th>Communication</th></tr></thead>
          <tbody>${(student.interviewHistory||[]).map(i=>`<tr>
            <td class="text-sm text-muted">${i.date}</td>
            <td style="font-weight:600">${i.type}</td>
            <td><span class="badge ${scoreBadge(i.score)}">${i.score}%</span></td>
            <td>${i.communication}%</td>
          </tr>`).join('')}</tbody>
        </table></div>` : `<div class="empty-state"><p>No interviews yet</p><a href="student-interview.html" class="btn btn-primary btn-sm" style="margin-top:8px">Start Interview</a></div>`}
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">📊 Detailed Score Analysis</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
        ${[
          { label:'Technical Skills', score:student.technicalScore, desc:'Based on mock tests and skill assessments', trend:'+3%' },
          { label:'Aptitude', score:student.aptitudeScore, desc:'Logical reasoning and quantitative ability', trend:'+2%' },
          { label:'Communication', score:student.communicationScore, desc:'Based on voice interview analysis', trend:'-2%' },
          { label:'Problem Solving', score:student.problemSolvingScore, desc:'Algorithmic and analytical thinking', trend:'+5%' },
          { label:'Interview Performance', score:student.interviewScore, desc:'Overall interview readiness', trend:'+1%' },
        ].map(s=>`<div class="card" style="padding:16px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
            <div style="font-weight:700;font-size:.9rem">${s.label}</div>
            <span class="badge ${s.trend.startsWith('+')?'badge-success':'badge-danger'}">${s.trend}</span>
          </div>
          <div style="font-size:1.8rem;font-weight:900;color:${scoreColor(s.score)};margin-bottom:4px">${s.score}%</div>
          <div class="progress-bar" style="margin-bottom:6px"><div class="progress-fill" style="width:${s.score}%;background:${scoreColor(s.score)}"></div></div>
          <div style="font-size:.75rem;color:#64748b">${s.desc}</div>
        </div>`).join('')}
      </div>
    </div>`;
}

renderPerformance();
</script>
</body>
</html>
